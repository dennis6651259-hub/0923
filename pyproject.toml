[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taiwan-weather-dashboard"
version = "1.0.0"
description = "Taiwan Weather Forecast AI & Data Visualization Dashboard"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "folium>=0.14.0",
    "streamlit-folium>=0.15.0",
    "plotly>=5.15.0",
    "urllib3>=2.0.0",
    "python-dotenv>=1.0.0",
]
